<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Name | Products</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            color:#333;
        }
        /* ========== 导航栏 固定高度100px ========== */
        nav {
            background-color: #FFFFFF; /*导航背景白色*/
            height:100px; /*导航栏固定高度100px*/
            position: fixed;
            width:100%;
            top:0;
            z-index:99;
        }
        .nav-container{
            height:100%;
            max-width:100%;
            margin:0;
            display:flex;
            align-items:center; /*垂直居中logo和菜单文字*/
            justify-content:space-between;
            padding:0;
        }
        .logo{
            margin-left:50px; /*logo距离屏幕最左侧50px*/
        }
        .logo img{
            width:240px;
            height:100px;
            object-fit:contain;
        }
        .menu-group{
            display:flex;
            gap:2.5rem;
            margin-right:100px; /*最右侧Contact距离屏幕右边缘100px*/
        }
        .menu-group a {
            color:#006847; /*潘通350 网页色*/
            text-decoration:none;
            font-size:16px;
            font-family:"Microsoft YaHei",sans-serif;
            font-weight:bold;
        }
        .menu-group a:hover{
            color:#009E49;
        }
        /* ========== Banner轮播 固定高度800px ========== */
        .banner-wrap{
            margin-top:100px; /*导航高度100px*/
            width:100%;
            height:800px;
            overflow:hidden;
            position:relative;
        }
        .banner-slider{
            width:300%;
            height:100%;
            display:flex;
            transition: all 0.6s ease-in-out;
        }
        .banner-item{
            width:100%;
            height:100%;
        }
        .banner-item img{
            width:100%;
            height:100%;
            object-fit:cover;
        }
        /* 左右箭头按钮 */
        .banner-btn{
            position:absolute;
            top:50%;
            transform:translateY(-50%);
            width:44px;
            height:44px;
            background:rgba(255,255,255,0.6);
            border:none;
            font-size:24px;
            cursor:pointer;
            border-radius:50%;
        }
        .prev{left:20px;}
        .next{right:20px;}
        .banner-btn:hover{
            background:#fff;
        }

        /* ========== Our Products 产品板块 ========== */
        .product-section{
            width:100%;
            padding:80px 0;
            background:#f8f8f8;
        }
        .container{
            max-width:1920px;
            margin:0 auto;
            padding:0 40px;
        }
        .section-title{
            text-align:center;
            font-size:42px;
            color:#333;
            margin:0 0 16px;
            font-family:"Microsoft YaHei",sans-serif;
        }
        .black-line{
            width:120px;
            height:2px;
            background:#000000;
            margin:0 auto 60px;
        }
        .product-grid{
            display:grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap:45px 30px;
        }
        .product-item{
            text-align:center;
        }
        .product-name{
            font-family:"Microsoft YaHei",sans-serif;
            font-size:20px;
            color:#009E49; /*潘通359*/
            text-shadow:1px 1px 2px #000000; /*黑色文字阴影*/
            margin-bottom:20px;
        }
        .product-img-box img{
            width:600px;
            height:400px;
            object-fit:cover;
        }
    </style>
</head>
<body>
<!-- 导航 左侧Logo + 右侧菜单 -->
<nav>
    <div class="nav-container">
        <div class="logo">
            <img src="https://raw.githubusercontent.com/xz775818301-prog/xz775818301-prog.github.io/refs/heads/main/logo1.home.jpg" alt="Company Logo">
        </div>
        <div class="menu-group">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="products.html">Products</a>
            <a href="news.html">News</a>
            <a href="contact.html">Contact</a>
        </div>
    </div>
</nav>

<!-- Banner轮播区域 -->
<div class="banner-wrap">
    <div class="banner-slider" id="slider">
        <div class="banner-item">
            <img src="https://raw.githubusercontent.com/xz775818301-prog/xz775818301-prog.github.io/refs/heads/main/banner1.jpg" alt="Banner 1">
        </div>
        <div class="banner-item">
            <img src="https://raw.githubusercontent.com/xz775818301-prog/xz775818301-prog.github.io/refs/heads/main/banner2.jpg" alt="Banner 2">
        </div>
        <div class="banner-item">
            <img src="https://raw.githubusercontent.com/xz775818301-prog/xz775818301-prog.github.io/refs/heads/main/banner3.jpg" alt="Banner 3">
        </div>
    </div>
    <button class="banner-btn prev" onclick="prevSlide()">&lt;</button>
    <button class="banner-btn next" onclick="nextSlide()">&gt;</button>
</div>

<script>
// 轮播JS代码
const slider = document.getElementById('slider');
let index = 0;
const total = 3;

function updateSlide(){
    slider.style.transform = `translateX(-${index * 100 / total}%)`
}
function nextSlide(){
    index = (index +1) % total;
    updateSlide();
}
function prevSlide(){
    index = (index -1 + total) % total;
    updateSlide();
}
// 自动轮播，5秒切换一张
let autoPlay = setInterval(nextSlide,5000);
// 鼠标悬停停止自动播放，移开继续
document.querySelector('.banner-wrap').addEventListener('mouseenter',()=>{
    clearInterval(autoPlay);
})
document.querySelector('.banner-wrap').addEventListener('mouseleave',()=>{
    autoPlay = setInterval(nextSlide,5000);
})
</script>

<!-- ========== Our Products 产品板块 6张图片链接已全部填入 ========== -->
<section class="product-section">
    <div class="container">
        <h2 class="section-title">Our Products</h2>
        <div class="black-line"></div>
        <div class="product-grid">
            <!-- 第1行 -->
            <div class="product-item">
                <h3 class="product-name">Plastic Sushi Container</h3>
                <div class="product-img-box">
                    <img src="https://raw.githubusercontent.com/xz775818301-prog/xz775818301-prog.github.io/refs/heads/main/products%20home%201.jpg" alt="Plastic Sushi Container">
                </div>
            </div>
            <div class="product-item">
                <h3 class="product-name">Paper Sushi Container</h3>
                <div class="product-img-box">
                    <img src="https://raw.githubusercontent.com/xz775818301-prog/xz775818301-prog.github.io/refs/heads/main/products%20home%202.jpg" alt="Paper Sushi Container">
                </div>
            </div>
            <div class="product-item">
                <h3 class="product-name">Bagasse Bento Box</h3>
                <div class="product-img-box">
                    <img src="https://raw.githubusercontent.com/xz775818301-prog/xz775818301-prog.github.io/refs/heads/main/products%20home%203.jpg" alt="Bagasse Bento Box">
                </div>
            </div>
            <!-- 第2行 -->
            <div class="product-item">
                <h3 class="product-name">Party Tray</h3>
                <div class="product-img-box">
                    <img src="https://raw.githubusercontent.com/xz775818301-prog/xz775818301-prog.github.io/refs/heads/main/products%20home%204.jpg" alt="Party Tray">
                </div>
            </div>
            <div class="product-item">
                <h3 class="product-name">Sauce Bottle</h3>
                <div class="product-img-box">
                    <img src="https://raw.githubusercontent.com/xz775818301-prog/xz775818301-prog.github.io/refs/heads/main/products%20home%205.jpg" alt="Sauce Bottle">
                </div>
            </div>
            <div class="product-item">
                <h3 class="product-name">Paper Bag</h3>
                <div class="product-img-box">
                    <img src="https://raw.githubusercontent.com/xz775818301-prog/xz775818301-prog.github.io/refs/heads/main/products%20home%206.jpg" alt="Paper Bag">
                </div>
            </div>
        </div>
    </div>
</section>

</body>
</html>
