<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Name | Products</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            color:#333;
        }
        /* ========== 导航栏【新版：白背景、左侧logo、文字Pantone350、加高导航】 ========== */
        nav {
            background-color: #FFFFFF; /*导航背景白色*/
            padding: 1rem 0;
            position: fixed;
            width:100%;
            top:0;
            z-index:99;
        }
        .nav-container{
            max-width:1200px;
            margin:0 auto;
            display:flex;
            align-items:center; /*垂直居中logo和菜单文字*/
            justify-content:space-between; /*左边logo，右边菜单*/
            padding:0 2rem;
        }
        .logo img{
            width:240px;
            height:100px;
            object-fit:contain;
        }
        .menu-group{
            display:flex;
            gap:2.5rem;
        }
        .menu-group a {
            color:#006847; /*潘通350 网页色*/
            text-decoration:none;
            font-size:16px;
            font-family:"Microsoft YaHei",sans-serif;
            font-weight:bold;
        }
        .menu-group a:hover{
            color:#009E49;
        }
        /* ========== Banner轮播 固定高度800px，适配你的1920*800图片 ========== */
        .banner-wrap{
            margin-top:120px; /*导航加高，这里同步加大距离，防止banner被导航盖住*/
            width:100%;
            height:800px;
            overflow:hidden;
            position:relative;
        }
        .banner-slider{
            width:300%;
            height:100%;
            display:flex;
            transition: all 0.6s ease-in-out;
        }
        .banner-item{
            width:100%;
            height:100%;
        }
        .banner-item img{
            width:100%;
            height:100%;
            object-fit:cover;
        }
        /* 左右箭头按钮 */
        .banner-btn{
            position:absolute;
            top:50%;
            transform:translateY(-50%);
            width:44px;
            height:44px;
            background:rgba(255,255,255,0.6);
            border:none;
            font-size:24px;
            cursor:pointer;
            border-radius:50%;
        }
        .prev{left:20px;}
        .next{right:20px;}
        .banner-btn:hover{
            background:#fff;
        }
    </style>
</head>
<body>
<!-- 导航 左侧Logo + 右侧菜单 -->
<nav>
    <div class="nav-container">
        <div class="logo">
            <img src="https://raw.githubusercontent.com/xz775818301-prog/xz775818301-prog.github.io/refs/heads/main/logo1.home.jpg" alt="Company Logo">
        </div>
        <div class="menu-group">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="products.html">Products</a>
            <a href="news.html">News</a>
            <a href="contact.html">Contact</a>
        </div>
    </div>
</nav>

<!-- Banner轮播区域 -->
<div class="banner-wrap">
    <div class="banner-slider" id="slider">
        <div class="banner-item">
            <img src="https://raw.githubusercontent.com/xz775818301-prog/xz775818301-prog.github.io/refs/heads/main/banner1.jpg" alt="Banner 1">
        </div>
        <div class="banner-item">
            <img src="https://raw.githubusercontent.com/xz775818301-prog/xz775818301-prog.github.io/refs/heads/main/banner2.jpg" alt="Banner 2">
        </div>
        <div class="banner-item">
            <img src="https://raw.githubusercontent.com/xz775818301-prog/xz775818301-prog.github.io/refs/heads/main/banner3.jpg" alt="Banner 3">
        </div>
    </div>
    <button class="banner-btn prev" onclick="prevSlide()">&lt;</button>
    <button class="banner-btn next" onclick="nextSlide()">&gt;</button>
</div>

<script>
// 轮播JS代码
const slider = document.getElementById('slider');
let index = 0;
const total = 3;

function updateSlide(){
    slider.style.transform = `translateX(-${index * 100 / total}%)`
}
function nextSlide(){
    index = (index +1) % total;
    updateSlide();
}
function prevSlide(){
    index = (index -1 + total) % total;
    updateSlide();
}
// 自动轮播，5秒切换一张
let autoPlay = setInterval(nextSlide,5000);
// 鼠标悬停停止自动播放，移开继续
document.querySelector('.banner-wrap').addEventListener('mouseenter',()=>{
    clearInterval(autoPlay);
})
document.querySelector('.banner-wrap').addEventListener('mouseleave',()=>{
    autoPlay = setInterval(nextSlide,5000);
})
</script>

<!-- 下面后续添加产品板块 -->

</body>
</html>
