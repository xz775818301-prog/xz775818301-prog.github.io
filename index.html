<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公司产品展示</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;}
        body{background:#f8f9fa;color:#333;line-height:1.6;}
        header{background:#222;color:#fff;padding:2rem;text-align:center;}
        .container{max-width:1200px;margin:0 auto;padding:2rem;}
        .product-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:2rem;margin-top:2rem;}
        .product-card{background:#fff;border-radius:12px;box-shadow:0 2px 10px #00000015;overflow:hidden;}
        .product-card img{width:100%;height:220px;object-fit:cover;}
        .product-card .info{padding:1.2rem;}
        .product-card h3{margin-bottom:0.5rem;}
        footer{text-align:center;padding:2rem;background:#222;color:#fff;margin-top:3rem;}
    </style>
</head>
<body>
<header>
    <h1>XX公司产品展示</h1>
    <p>高品质产品 | 专业供应</p>
</header>
<div class="container">
    <section>
        <h2>产品中心</h2>
        <div class="product-list">
            <!-- 产品卡片，复制整块可以增加更多产品 -->
            <div class="product-card">
                <img src="https://picsum.photos/id/101/600/400" alt="产品1">
                <div class="info">
                    <h3>产品名称1</h3>
                    <p>产品简短描述，填写产品特点、规格、优势</p>
                </div>
            </div>
            <div class="product-card">
                <img src="https://picsum.photos/id/102/600/400" alt="产品2">
                <div class="info">
                    <h3>产品名称2</h3>
                    <p>产品简短描述，填写产品特点、规格、优势</p>
                </div>
            </div>
        </div>
    </section>
</div>
<footer>
    <p>联系我们：电话 13800138000 | 邮箱 demo@company.com</p>
    <p>©2026 XX公司 All Rights Reserved</p>
</footer>
</body>
</html>
